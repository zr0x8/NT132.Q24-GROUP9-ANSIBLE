---
- name: Create mattermost group
  group:
    name: "{{ mattermost_group }}"
    system: yes

- name: Create mattermost user
  user:
    name: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    system: yes
    create_home: no

- name: Remove conflicting containerd packages
  apt:
    name:
      - containerd
      - containerd.io
      - docker-ce
      - docker-ce-cli
    state: absent

- name: Remove leftover containerd config
  file:
    path: /etc/containerd/config.toml
    state: absent

- name: Clean up old docker apt sources
  shell: rm -f /etc/apt/sources.list.d/*docker*.list
  ignore_errors: yes

- name: Download Docker installation script
  get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: '0755'

- name: Run Docker installation script
  command: /tmp/get-docker.sh

- name: Install docker python module
  apt:
    name: python3-docker
    state: present
    update_cache: yes

- name: Ensure Docker and Containerd are running
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - containerd
    - docker

- name: Create mattermost directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "2000"
    group: "2000"
    mode: '0755'
  loop:
    - "{{ mattermost_deploy_dir }}"
    - "{{ mattermost_deploy_dir }}/data"
    - "{{ mattermost_deploy_dir }}/config"
    - "{{ mattermost_deploy_dir }}/logs"
    - "{{ mattermost_deploy_dir }}/plugins"
    - "{{ mattermost_deploy_dir }}/client/plugins"

- name: Ensure correct ownership on mattermost directories
  command: chown -R 2000:2000 {{ mattermost_deploy_dir }}

- name: Configure Mattermost
  template:
    src: config.json.j2
    dest: "{{ mattermost_deploy_dir }}/config/config.json"
    owner: "2000"
    group: "2000"
  notify: Restart Mattermost Container

- name: Display Mattermost Docker image information
  debug:
    msg: "Pulling Mattermost Docker image: {{ mattermost_docker_image }}:{{ image_tag | default('latest') }}"

- name: Pull Mattermost Docker image
  community.docker.docker_image:
    name: "{{ mattermost_docker_image }}:{{ image_tag | default('latest') }}"
    source: pull
    force_source: true

- name: Run Mattermost container
  community.docker.docker_container:
    name: mattermost
    image: "{{ mattermost_docker_image }}:{{ image_tag | default('latest') }}"
    state: started
    restart_policy: always
    image_name_mismatch: recreate
    recreate: true
    ports:
      - "{{ mattermost_port }}:{{ mattermost_port }}"
    volumes:
      - "{{ mattermost_deploy_dir }}/config:/mattermost/config"
      - "{{ mattermost_deploy_dir }}/data:/mattermost/data"
      - "{{ mattermost_deploy_dir }}/logs:/mattermost/logs"
      - "{{ mattermost_deploy_dir }}/plugins:/mattermost/plugins"
      - "{{ mattermost_deploy_dir }}/client/plugins:/mattermost/client/plugins"
    user: "2000:2000"
    security_opts:
      - "no-new-privileges:true"
    cap_drop: 
      - ALL
