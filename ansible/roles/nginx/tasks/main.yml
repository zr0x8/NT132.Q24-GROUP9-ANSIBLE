---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Generate self-signed SSL certificate
  command: openssl req -new -newkey rsa:2048 -days 3650 -nodes -x509 -subj "/C=US/ST=State/L=City/O=Organization/CN={{ nginx_server_name }}" -keyout {{ nginx_ssl_certificate_key_path }} -out {{ nginx_ssl_certificate_path }}
  args:
    creates: "{{ nginx_ssl_certificate_path }}"
  notify: Reload Nginx

- name: Configure Nginx for Mattermost
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/mattermost
  notify: Reload Nginx

- name: Enable Mattermost site
  file:
    src: /etc/nginx/sites-available/mattermost
    dest: /etc/nginx/sites-enabled/mattermost
    state: link
  notify: Reload Nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is running and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes
