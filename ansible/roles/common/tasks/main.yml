---
- name: Clean up old docker apt sources
  shell: rm -f /etc/apt/sources.list.d/*docker*.list
  ignore_errors: yes

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - unzip
      - ufw
    state: present
