---
- name: Deploy Zabbix server on control node
  hosts: control
  become: yes
  gather_facts: yes
  tasks:
    - name: Apply zabbix server role
      import_role:
        name: ../roles/zabbix_server
    - name: Save runtime zabbix server ip for agent rollout
      set_fact:
        zabbix_server_ip_runtime: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

- name: Deploy Zabbix agent on all nodes
  hosts: control:managed
  become: yes
  gather_facts: yes
  vars:
    zabbix_server_ip: "{{ hostvars[groups['control'][0]]['zabbix_server_ip_runtime'] | default(hostvars[groups['control'][0]]['ansible_host']) }}"
    zabbix_agent_server_allowlist: "{{ zabbix_server_ip }},172.18.0.0/16"
  tasks:
    - name: Apply zabbix agent role
      import_role:
        name: ../roles/zabbix_agent

- name: Configure web VM subpath — reverse proxy tới control node
  hosts: web
  become: yes
  gather_facts: yes
  vars:
    nginx_port: 443
    nginx_server_name: "{{ web_host | default(ansible_host) }}"
    nginx_ssl_certificate_path: "/etc/ssl/certs/mattermost.crt"
    nginx_ssl_certificate_key_path: "/etc/ssl/private/mattermost.key"
    enable_zabbix_monitor_subpath: true
    zabbix_monitor_subpath: "/zabbix_monitor"
    zabbix_monitor_upstream_host: "{{ hostvars[groups['control'][0]]['ansible_host'] }}"
    zabbix_monitor_upstream_port: "{{ secret_zabbix_web_port | default(8088) }}"
  tasks:
    - name: Apply nginx role with zabbix subpath enabled
      import_role:
        name: ../roles/nginx